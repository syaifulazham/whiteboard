worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream nextjs {
    server app:3000;
    keepalive 64;
  }

  # Increase timeouts and body size for canvas snapshots
  client_max_body_size 20m;
  proxy_connect_timeout 60s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;           # replace with your domain

    # ── SSE endpoints — must not buffer ─────────────────────────────────────
    location ~* ^/api/sessions/[^/]+/stream {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        '';  # keep-alive, not upgrade

      proxy_buffering            off;
      proxy_cache                off;
      proxy_read_timeout         3600s;   # 1 h — browser will reconnect anyway
      proxy_send_timeout         3600s;
      add_header X-Accel-Buffering no;
    }

    # ── Everything else ──────────────────────────────────────────────────────
    location / {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;

      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        'upgrade';
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass                 $http_upgrade;
    }
  }
}
